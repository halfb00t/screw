[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "screw"
dynamic = ["version"]
description = "Parametric thread and fastener generator: web UI, HTTP API and CLI with STL/STEP export"
readme = "README.md"
# 3.12 only (L01): cadquery-ocp publishes wheels for nothing newer, and the upper bound
# makes pip refuse instead of spending minutes building OpenCascade from source.
requires-python = ">=3.12,<3.13"
keywords = ["thread", "screw", "bolt", "nut", "cad", "cadquery", "stl", "step", "3d-printing"]
dependencies = [
    "cadquery>=2.5",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.scripts]
screw = "screw.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8",
    "pytest-cov>=7.1",
    "httpx2>=2.13",
    "ruff>=0.14",
    "mypy>=1.18",
    "import-linter>=2.3",
    "pre-commit>=4",
]

[tool.hatch.version]
path = "src/screw/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/screw"]

# --- the gate: lint, types, import boundaries, tests. `make verify` runs all four (L03). --

[tool.ruff]
target-version = "py312"   # one supported interpreter (L01)
line-length = 100

# `ruff format` is deliberately not part of this project -- L05.

[tool.ruff.lint]
# High-signal set, not "ALL": ALL churns between ruff releases and turns review into
# bikeshedding. No D/DOC (docstrings here are prose, not a schema), no ANN (mypy strict
# already demands annotations).
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # import sorting
    "N",             # naming
    "UP",            # modern syntax for the supported Python
    "B",             # bugbear: real bugs, not style
    "SIM",           # simplifications
    "C4",            # comprehensions
    "PTH",           # pathlib over os.path
    "TID",           # tidy imports
    "ARG",           # unused arguments
    "ERA",           # commented-out code
    "TRY",           # exception antipatterns
    "LOG", "G",      # logging correctness
    "PT",            # pytest style
    "RUF",           # ruff's own, including RUF100: an unused noqa is an error
]
# A bare `# noqa` is itself a violation -- suppress one rule, by code, or not at all.
ignore = [
    # TRY003 wants long messages moved into exception classes. This project's error
    # messages are the product: they name the offending parameter and say what to
    # change. A class per message would make them worse, not better. See L05.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Tests name their fixtures and parametrised cases for the reader, not for a linter.
"tests/*" = ["ARG001"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]   # without it mypy cannot see the generated model __init__
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
# On from the first line, for everything mypy checks, with no per-module exception (L04).
# `Any` is not written in this codebase: a genuinely untyped value is `object`, and a
# value a library already names keeps the library's own alias.
disallow_any_explicit = true

[tool.pydantic-mypy]
# Without these the pydantic mypy plugin writes an explicit `Any` into the initialiser it
# generates for every model and reports it on the model's own `class` line -- spur
# counted exactly six, one per model, before adding them (spur L21). Trade-off: every
# model constructor call is type-checked against its fields. Static only.
init_typed = true
init_forbid_extra = true

[[tool.mypy.overrides]]
# OCP, the OpenCascade binding, ships no type information (no .pyi and no py.typed in
# cadquery-ocp 7.9.x), so the entry is scoped to it -- never a global
# ignore_missing_imports, which would blind the whole project. cadquery itself ships
# py.typed and needs no entry.
module = ["OCP.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/screw"]
# BuildPool's workers are spawned processes and pytest-cov 7 dropped its subprocess hook,
# so "multiprocessing" is what makes coverage measure them. "thread" must be listed too:
# setting the key replaces coverage's default, and without it the lifespan thread that
# builds and shuts down the pool stops being traced (spur measured pool.py at 85 % that
# way). "parallel" writes one data file per process for pytest-cov to combine; "sigterm"
# saves the data of a worker pool.py terminates -- a guard, since no test is known to
# terminate a worker inside src/screw.
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.coverage.report]
# The floor, read by `make test`'s --cov and nowhere else (pytest-cov copies this value
# when --cov-fail-under is absent): 94 = floor(L - max(0.25, S)) with L = 95.03 (the
# serial run, the lowest of four totals) and S = 0.00 (the spread of three -n 8 totals,
# all 95.56) -- bench/RESULTS.md "Coverage floor (Phase 1)", measured 2026-10-06 on the
# 285-test skeleton suite, spur L34's rule. Re-measure the same way before moving it.
fail_under = 94
# fail_under compares the total rounded to `precision`; the default 0 let spur's 45.93 %
# total pass a floor of 46.
precision = 2

[tool.importlinter]
root_package = "screw"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The app never imports its own tests"
type = "forbidden"
source_modules = ["screw"]
forbidden_modules = ["tests"]

[[tool.importlinter.contracts]]
name = "The thread maths stays free of the CAD kernel"
# calc runs on every keystroke in the UI. It is pure arithmetic on purpose: the moment it
# can reach OpenCascade, that property is gone and nobody notices until the form goes slow.
# The solid package is the only code allowed to touch the kernel (contract 8 below says so
# for the whole tree).
type = "forbidden"
source_modules = ["screw.calc", "screw.params", "screw.cli"]
forbidden_modules = ["cadquery", "OCP"]
# Reaching the kernel *through* the solid package is the whole point of lazy imports in the
# CLI; only a direct import here is the violation.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The CLI does not inherit web-serving policy"
# Admission control (the bounded build queue) is a property of serving HTTP, not of
# building a part: a CLI export must never queue behind anything (spur L04).
type = "forbidden"
source_modules = ["screw.cli"]
forbidden_modules = ["screw.app", "fastapi", "starlette"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The thread maths stays free of the logger"
# calc runs on every keystroke in the UI and must stay pure arithmetic, the same reason it
# must stay free of the CAD kernel above -- a logging import would mean this package can
# raise from formatting/handler I/O, or silently drift its own state. `warnings` in the
# info document is its diagnostic.
type = "forbidden"
source_modules = ["screw.calc"]
forbidden_modules = ["screw.records", "logging"]

[[tool.importlinter.contracts]]
name = "The serving process never imports the CAD kernel"
# app.py never imports the solid package: builds happen in worker processes only, reached
# through screw.pool's runtime importlib call, never a static import. The serving process's
# memory must never contain OpenCascade, so a transitive path is as bad as a direct one --
# allow_indirect_imports = false is what makes mem_limit a number about a kernel-free
# parent plus N workers, rather than a guess.
type = "forbidden"
source_modules = ["screw.app"]
forbidden_modules = ["cadquery", "OCP"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Only the solid package imports the CAD kernel"
# The one doorway: no CadQuery object escapes screw.solid, and no other module may even
# import it (contract 2 only covers the maths; this covers everything else, present and
# future). screw.solid's own edges to the kernel are the point, so they are ignored; both
# forms are listed because `screw.solid.**` does not match `screw.solid` itself, and an
# ignore that matches nothing is itself an error in import-linter.
type = "forbidden"
source_modules = ["screw"]
forbidden_modules = ["cadquery", "OCP"]
ignore_imports = ["screw.solid -> cadquery", "screw.solid.** -> cadquery"]
