name: grid

# The slow thread tier (D-14): the whole measured 02 D-03 grid, 7160 rows, through the THRD-04
# gate (tests/test_grid.py). It records and never gates `main`.
#
# It is not in ci.yml on purpose. L08 says every job in ci.yml is required green on a PR head,
# so a slow, recording-only tier there would either gate every merge or break that rule;
# `.github/workflows/required-jobs.txt` is unchanged and `make pr.land` reads ci.yml runs only
# (scripts/pr_land.py `WORKFLOW`).
#
# No `pull_request` or branch-push trigger: no untrusted code runs with this token, and the
# token reads the repository and nothing else (T-3-14). tests/test_grid.py pins all three.
on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 03:23 UTC. GitHub may disable a schedule after 60 days without repository
    # activity (ASSUMPTION A4, from memory, not fetched); `workflow_dispatch` still works.
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  grid:
    runs-on: ubuntu-latest
    # Sizing is UNVERIFIED on GitHub runners (A2, A3): about 2 s per row on a loaded 18-core
    # host, the largest shard (M20) about 960 rows over 4 workers. The first run's wall time is
    # recorded in bench/RESULTS.md, never asserted.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        size: [M2, M2.5, M3, M3.5, M4, M5, M6, M7, M8, M10, M12, M14, M16, M18, M20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: make grid PYTHON=python SIZE=${{ matrix.size }}
      # `.venv` exists only once make grid has made it; `if: always()` keeps the pair in the
      # log of a red run too.
      - name: kernel pair this run resolved
        if: always()
        run: >-
          .venv/bin/python -c "from importlib.metadata import version;
          print('cadquery', version('cadquery'), 'cadquery-ocp', version('cadquery-ocp'))"
