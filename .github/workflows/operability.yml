name: operability

# The runner side of Phase 7 (OPER-01, OPER-02): a point file (bench/points/<set>.json) is read on
# a GitHub-hosted ubuntu-latest runner, one fresh container of the production image per reading.
#
# 07 D-01: the runner is the only host whose figures bound anything. Every JSONL header records
# nproc, memory, the CPU model, the kernel and the run id, because GitHub mixes CPU generations
# behind the one label. Run it from the Actions tab (or `gh workflow run operability.yml -f
# set=tracer`); anyone can repeat a run.
#
# 07 D-15: the image is built from the commit under test, exactly as the image job in ci.yml
# builds it, and each reading starts a new container of it under its own memory cap.
#
# 07 D-12, D-13: the full recording tier (bench/points/full.json, R28) runs weekly and on every
# PR that touches a file that can move a prediction, a budget or a timeout the tiers judge:
#   src/screw/calc/cost.py    the cost model, the budgets and the timeouts;
#   src/screw/calc/thread.py  built_thread_length, a cost feature, and the turn and tail walls;
#   src/screw/params.py       the field ceilings;
#   src/screw/solid/**        the tessellation constants and the build.
# A run with no `set` input (schedule, PR) reads the full set. The paths filter only saves runs:
# a PR author controls this file in their own PR, so `make pr.land` decides from the PR's diff and
# its own list (`FULL_TIER_PATHS` in scripts/pr_land.py, held equal to `paths:` by a test).
#
# T-3-14, T-07-02: the PR trigger is `pull_request`, which runs the PR's code with a read-only
# token and no secrets, the exposure ci.yml's `test` job already has. The base-context PR event,
# which hands a fork's code the base's secrets, is the case T-3-14 forbids, and it is not used.
# The token reads the repository and nothing else, and no job names a secret. The `set` input is
# typed by a human; it reaches a script only through an environment variable, is checked
# against [a-z0-9-]+ and an existing file by `python -m bench.oper matrix`, and is never
# interpolated into a shell line. tests/test_oper.py pins all of it.
on:
  workflow_dispatch:
    inputs:
      set:
        description: "point file name under bench/points/ (letters, digits and hyphens); full if empty"
        required: false
        type: string
  schedule:
    # Weekly, Monday 04:41 UTC, off grid.yml's 03:23 so the two never share a runner hour.
    - cron: "41 4 * * 1"
  pull_request:
    paths:
      - "src/screw/calc/cost.py"
      - "src/screw/calc/thread.py"
      - "src/screw/params.py"
      - "src/screw/solid/**"
      - "Dockerfile"
      - "requirements.txt"

run-name: "operability: ${{ inputs.set || 'full' }}"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      # The parent is standard-library only, so a bare interpreter runs it; no dependency cache.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: m
        env:
          SET: ${{ inputs.set || 'full' }}
        run: python -m bench.oper matrix --set "$SET" >> "$GITHUB_OUTPUT"

  measure:
    needs: plan
    runs-on: ubuntu-latest
    # Below the hosted-job ceiling (ASSUMPTION A7: 6 h, from memory, not fetched). A reading that
    # reaches its own deadline is killed and recorded long before this.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SET: ${{ inputs.set || 'full' }}
      SHARD: ${{ matrix.shard }}
      REP: ${{ matrix.rep }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: screw:ci
      - name: take the readings
        run: >-
          python -m bench.oper run --set "$SET" --shard "$SHARD" --rep "$REP"
          --image screw:ci --out "oper-$SET-$SHARD-$REP.jsonl"
      # `if: always()` keeps the readings of a red run: a capped or killed reading is a record.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oper-${{ env.SET }}-${{ env.SHARD }}-${{ env.REP }}
          path: oper-${{ env.SET }}-${{ env.SHARD }}-${{ env.REP }}.jsonl
          retention-days: 30
      # A display aid only: a shard with no points has no readings to summarize, and the JSONL
      # artifact above is the record.
      - name: job summary
        if: always()
        continue-on-error: true
        run: python -m bench.oper summarize --markdown --reps "$REP" "oper-$SET-$SHARD-$REP.jsonl" >> "$GITHUB_STEP_SUMMARY"

  # R5 (07-19): the full tier reads each point once; a point whose single cold wall x (1 + m)
  # reaches its timeout is read again at repetitions 1 to 5, as 5 matrix jobs of this run, so on
  # 5 runner instances (R3). The selection is `bench.oper followup-matrix` over the committed
  # full.json and this run's measure records: no point file is written here (R30). The three jobs
  # run for the full set only, use only this run's artifacts and keep `contents: read` (T-3-14).
  followup-plan:
    needs: measure
    if: always() && (inputs.set || 'full') == 'full'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: oper-full-*
          path: records
      - id: m
        run: python -m bench.oper followup-matrix --set full --from records >> "$GITHUB_OUTPUT"

  followup:
    needs: followup-plan
    # Skipped when the selection is empty: a matrix with no entry is an error, not an empty job.
    if: always() && needs.followup-plan.result == 'success' && needs.followup-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.followup-plan.outputs.matrix) }}
    env:
      SHARD: ${{ matrix.shard }}
      REP: ${{ matrix.rep }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: screw:ci
      - uses: actions/download-artifact@v4
        with:
          pattern: oper-full-*
          path: records
      - name: take the follow-up readings
        run: >-
          python -m bench.oper run --set full --followup-from records --shard "$SHARD"
          --rep "$REP" --image screw:ci --out "oper-full-followup-$SHARD-$REP.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oper-full-followup-${{ env.SHARD }}-${{ env.REP }}
          path: oper-full-followup-${{ env.SHARD }}-${{ env.REP }}.jsonl
          retention-days: 30

  # R29 over every reading of the run, the follow-ups on their 5 repetitions: a miss, a missing
  # reading or an incomplete follow-up fails the tier.
  verdict:
    needs: [measure, followup-plan, followup]
    if: always() && (inputs.set || 'full') == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: oper-full-*
          path: records
      - run: python -m bench.oper verdict --set full --from records
